# =====================================================================
# Gestion des stagiaires — stack complète
#   MySQL 8  +  Backend Spring Boot  +  Frontend Angular (SSR)
#
# Démarrage :
#   cp .env.example .env      # puis adapter les secrets
#   docker compose up --build
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: stagiaires-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Publié uniquement sur la machine hôte (outils locaux) : jamais sur le réseau.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend_spring
    container_name: stagiaires-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      LOG_LEVEL_ASPECT: ${LOG_LEVEL_ASPECT:-INFO}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Casablanca}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env (openssl rand -base64 48)}
      JWT_DUREE: ${JWT_DUREE:-8h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ORGANISATION_NOM: ${ORGANISATION_NOM:-Organisme d'accueil}
      ORGANISATION_VILLE: ${ORGANISATION_VILLE:-Casablanca}
      ORGANISATION_SIGNATAIRE: ${ORGANISATION_SIGNATAIRE:-}
      ORGANISATION_FONCTION: ${ORGANISATION_FONCTION:-Directeur des Ressources Humaines}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend_angular
      args:
        API_URL: ${API_URL:-http://localhost:8080}
    container_name: stagiaires-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
      # Origine autorisée par la CSP (connect-src) — doit correspondre à API_URL.
      API_ORIGIN: ${API_URL:-http://localhost:8080}
      # Hôtes autorisés pour le rendu SSR (protection anti-SSRF d'Angular).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
