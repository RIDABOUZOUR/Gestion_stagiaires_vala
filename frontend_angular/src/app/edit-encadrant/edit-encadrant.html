<div class="mx-auto max-w-3xl">
  <div class="card">
    <div class="card-header">
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-amber-50 text-amber-600">
          <app-icon name="pencil-square"></app-icon>
        </span>
        <h2 class="text-base font-semibold text-slate-900">Modifier un encadrant</h2>
      </div>
    </div>

    <div *ngIf="loading" class="flex items-center justify-center gap-3 p-12 text-sm text-slate-500">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-slate-300 border-t-indigo-600"></span>
      Chargement…
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onUpdate()" class="card-body space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label class="label" for="nom">Nom <span class="text-rose-500">*</span></label>
          <input id="nom" type="text" formControlName="nom" class="input" [class.input-invalid]="isInvalid('nom')" />
          <p class="field-error" *ngIf="isInvalid('nom')">Le nom est obligatoire (3 à 40 caractères).</p>
        </div>

        <div>
          <label class="label" for="prenom">Prénom <span class="text-rose-500">*</span></label>
          <input id="prenom" type="text" formControlName="prenom" class="input" [class.input-invalid]="isInvalid('prenom')" />
          <p class="field-error" *ngIf="isInvalid('prenom')">Le prénom est obligatoire (3 à 40 caractères).</p>
        </div>

        <div>
          <label class="label" for="email">Email <span class="text-rose-500">*</span></label>
          <input id="email" type="email" formControlName="email" class="input" [class.input-invalid]="isInvalid('email')" />
          <p class="field-error" *ngIf="isInvalid('email')">Un email valide est obligatoire.</p>
        </div>

        <div>
          <label class="label" for="telephone">Téléphone</label>
          <input id="telephone" type="tel" formControlName="telephone" class="input" [class.input-invalid]="isInvalid('telephone')" />
          <p class="field-error" *ngIf="isInvalid('telephone')">10 chiffres (indicatif international optionnel).</p>
        </div>
      </div>

      <div class="flex flex-wrap justify-between gap-3 border-t border-slate-100 pt-5">
        <a routerLink="/encadrants" class="btn btn-secondary">
          <app-icon name="arrow-left" size="h-4 w-4"></app-icon>
          Retour
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <app-icon name="check-circle" size="h-4 w-4"></app-icon>
          {{ saving ? 'Enregistrement…' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
