<div class="grid gap-4 lg:grid-cols-2">
  <div class="card" *ngFor="let config of charts">
    <div class="card-header">
      <div class="flex items-center gap-3">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-lg"
          [ngClass]="config.iconBg">
          <app-icon [name]="config.icon"></app-icon>
        </span>
        <h3 class="text-sm font-semibold text-slate-900">{{ config.title }}</h3>
      </div>
    </div>
    <div class="card-body">
      <div class="relative h-72">
        <canvas #chartCanvas [id]="config.id"></canvas>
      </div>
    </div>
  </div>
</div>
