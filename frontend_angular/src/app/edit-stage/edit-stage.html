<div class="mx-auto max-w-3xl">
  <div class="card">
    <div class="card-header">
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-amber-50 text-amber-600">
          <app-icon name="pencil-square"></app-icon>
        </span>
        <h2 class="text-base font-semibold text-slate-900">Modifier un stage</h2>
      </div>
    </div>

    <div *ngIf="loading" class="flex items-center justify-center gap-3 p-12 text-sm text-slate-500">
      <span class="h-5 w-5 animate-spin rounded-full border-2 border-slate-300 border-t-indigo-600"></span>
      Chargement…
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="handleUpdateStage()" class="card-body space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <label class="label" for="sujet">Sujet <span class="text-rose-500">*</span></label>
          <input id="sujet" type="text" formControlName="sujet" class="input" [class.input-invalid]="isInvalid('sujet')" />
          <p class="field-error" *ngIf="isInvalid('sujet')">Le sujet est obligatoire (100 caractères max.).</p>
        </div>

        <div>
          <label class="label" for="dateDebut">Date de début <span class="text-rose-500">*</span></label>
          <input id="dateDebut" type="date" formControlName="dateDebut" class="input" [class.input-invalid]="isInvalid('dateDebut')" />
          <p class="field-error" *ngIf="isInvalid('dateDebut')">La date de début est obligatoire.</p>
        </div>

        <div>
          <label class="label" for="dateFin">Date de fin <span class="text-rose-500">*</span></label>
          <input id="dateFin" type="date" formControlName="dateFin" class="input" [class.input-invalid]="isInvalid('dateFin')" />
          <p class="field-error" *ngIf="isInvalid('dateFin')">La date de fin est obligatoire.</p>
        </div>

        <div>
          <label class="label" for="status">Statut <span class="text-rose-500">*</span></label>
          <select id="status" formControlName="status" class="input" [class.input-invalid]="isInvalid('status')">
            <option value="PLANIFIE">Planifié</option>
            <option value="EN_COURS">En cours</option>
            <option value="TERMINE">Terminé</option>
            <option value="ANNULE">Annulé</option>
          </select>
          <p class="field-error" *ngIf="isInvalid('status')">Le statut est obligatoire.</p>
        </div>

        <div>
          <label class="label" for="encadrant">Encadrant <span class="text-rose-500">*</span></label>
          <select id="encadrant" formControlName="encadrant" class="input" [class.input-invalid]="isInvalid('encadrant')">
            <option value="">-- Sélectionner un encadrant --</option>
            <option *ngFor="let encadrant of encadrantsList" [value]="encadrant.id">{{ encadrant.nom }} {{ encadrant.prenom }}</option>
          </select>
          <p class="field-error" *ngIf="isInvalid('encadrant')">L'encadrant est obligatoire.</p>
        </div>
      </div>

      <div class="flex flex-wrap justify-between gap-3 border-t border-slate-100 pt-5">
        <a routerLink="/stages" class="btn btn-secondary">
          <app-icon name="arrow-left" size="h-4 w-4"></app-icon>
          Retour
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <app-icon name="check-circle" size="h-4 w-4"></app-icon>
          {{ saving ? 'Enregistrement…' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
