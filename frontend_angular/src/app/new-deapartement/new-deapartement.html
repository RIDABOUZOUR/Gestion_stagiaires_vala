<div class="mx-auto max-w-3xl">
  <div class="card">
    <div class="card-header">
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600">
          <app-icon name="building-office"></app-icon>
        </span>
        <h2 class="text-base font-semibold text-slate-900">Nouveau département</h2>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="handleSaveDepartement()" class="card-body space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <div>
          <label class="label" for="nom">Nom <span class="text-rose-500">*</span></label>
          <input id="nom" type="text" formControlName="nom" class="input" [class.input-invalid]="isInvalid('nom')" placeholder="Entrez le nom du département" />
          <p class="field-error" *ngIf="isInvalid('nom')">Le nom est obligatoire (3 à 40 caractères).</p>
        </div>

        <div>
          <label class="label" for="responsable">Responsable <span class="text-rose-500">*</span></label>
          <input id="responsable" type="text" formControlName="responsable" class="input" [class.input-invalid]="isInvalid('responsable')" placeholder="Entrez le nom du responsable" />
          <p class="field-error" *ngIf="isInvalid('responsable')">Le responsable est obligatoire (3 à 40 caractères).</p>
        </div>
      </div>

      <div class="flex flex-wrap justify-between gap-3 border-t border-slate-100 pt-5">
        <a routerLink="/departements" class="btn btn-secondary">
          <app-icon name="arrow-left" size="h-4 w-4"></app-icon>
          Retour
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <app-icon name="check-circle" size="h-4 w-4"></app-icon>
          {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
