# Hôte MySQL = nom du service dans docker-compose
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stagiaires-db}?createDatabaseIfNotExist=true

# Pas de logs SQL en environnement conteneurisé
spring.jpa.show-sql=false
