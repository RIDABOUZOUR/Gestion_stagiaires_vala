# =====================================================================
# Profil Docker — activé via SPRING_PROFILES_ACTIVE=docker
# Surcharge les valeurs par défaut de application.properties
# =====================================================================

# Hôte MySQL = nom du service dans docker-compose
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stagiaires-db}?createDatabaseIfNotExist=true

# Pas de logs SQL en environnement conteneurisé
spring.jpa.show-sql=false

# Swagger UI et /v3/api-docs exposent la carte de l'API : coupés sauf SPRINGDOC_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
