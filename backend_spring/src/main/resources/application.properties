#spring.application.name=gestionStagiaires

# =====================================================================
# Datasource — AUCUN secret en clair ici.
# Les valeurs sont injectées via variables d'environnement (.env / Docker).
# Voir .env.example à la racine du projet.
# =====================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stagiaires-db}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# =====================================================================
# CORS — origines autorisées (liste séparée par des virgules)
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
