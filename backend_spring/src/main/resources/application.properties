#spring.application.name=gestionStagiaires

# =====================================================================
# Datasource — AUCUN secret en clair ici.
# Les valeurs sont injectées via variables d'environnement (.env / Docker).
# Voir .env.example à la racine du projet.
# =====================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stagiaires-db}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# =====================================================================
# CORS — origines autorisées (liste séparée par des virgules)
# =====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =====================================================================
# Logging — aspect AOP (couches @Service et @RestController)
# INFO = durée des appels ; DEBUG = + arguments et résultats.
# =====================================================================
logging.level.com.vala.gestionStagiaires.aspect=${LOG_LEVEL_ASPECT:INFO}

# =====================================================================
# Tâches planifiées — mise à jour automatique des statuts de stage
# (cron Spring : seconde minute heure jour mois jour-semaine)
# =====================================================================
app.scheduling.enabled=${APP_SCHEDULING_ENABLED:true}
app.stages.status-cron=${STAGES_STATUS_CRON:0 5 0 * * *}

# =====================================================================
# Règles métier
# =====================================================================
# Âge minimum du stagiaire au début du stage (0 = pas de contrôle)
app.regles.age-minimum=${REGLE_AGE_MINIMUM:16}
# Nombre maximal de stages EN_COURS par encadrant (0 = illimité)
app.regles.max-stages-en-cours-par-encadrant=${REGLE_MAX_STAGES_EN_COURS:0}
